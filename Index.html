<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:wght@700&family=Playwrite+AU+VIC+Guides&display=swap"
        rel="stylesheet">
    <style>
        @font-face {
            font-family: "Norse";
            src: url("font/Norsebold.otf") format("opentype");
            font-weight: normal;
            font-style: normal;

        }

        * {
            padding: 0;
            margin: 0;
        }

        .container {
            display: flex;
        }

        .bg-img {
            background-image: url('https://images.unsplash.com/photo-1585202900225-6d3ac20a6962?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            height: 100vh;
            width: 35vw;
            background-repeat: no-repeat;
            background-size: cover;



        }

        .box {
            position: relative;
            background-color: black;
            opacity: 0.8;
            display: flex;
            height: 27vh;
            justify-content: center;
            align-items: center;
            top: 20vh;
        }

        .logo {
            width: 7vw;
            height: 20vh;
        }

        h1 {
            color: white;
            font-family: "Norse";
            font-size: 16vh;
        }

        button {
            color: white;
            background-color: #596D48;
            height: 6vh;
            width: 10vw;
            border: 0;
            border-radius: 6px;
            margin: 20px;
        }

        .leftside {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: baseline;
            justify-content: center;
            gap: 10vh;
            background-color: #F9FAFB;
        }

        p {
            position: relative;
            font-size: larger;
            font-weight: 600;
            background-color: #F9FAFB;
            right: -20px;

        }

        fieldset {
            height: 50vh;
            width: 70vw;
            display: grid;
            grid-template-columns: repeat(2, 1fr);

            grid-template-rows: repeat(2);
            border: 0;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            justify-content: center;
            align-items: center;
           



        }

        input {
            border-color: #E5E7EB;
            height: 20px;
            width: 16vw;
            border-radius: 6px;
            margin-left: 20px;
            margin-top: 0;
        }

        input:user-invalid {
            border: 2px solid red;
            background-color: beige;
        }

        label {
            margin-bottom: 0;
            margin-left: 20px;
        }
        
        h2{
            margin: 12px;
        }
        a{
            margin-left: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bg-img">
            <div class="box">
                <img class="logo"
                    src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
                    alt="">
                <h1>ODIN</h1>
            </div>
        </div>
        <div class="leftside">
            <p>This is not a real online service! You know you need something <br> like this in your life to help you
                realize
                your deepest dreams. <br>

                Sign up now to get started.
                <br> <br> <br>
                You know you want to.
            </p>
            <form action="#####">
                
                <fieldset>
                    <h2>Let's do this! </h2> <br>
                    
                    <label for="FirstName">FirstName</label>
                    <label for="LastName">LastName</label>
                    <input type="text" id="FirstName" name="FirstName" required>
                    <input type="text" id="LastName" name="LastName" required>

                    <label for="email">Email</label>
                    <label for="Phone">Phone</label>
                    <input type="email" id="email" name="email" required>
                    <input type="number" id="Phone" name="number" required>

                    <label for="password">password</label>
                    <label for="ConfirmPassword">confirmpassword</label>
                    <input style="margin-bottom: 10px;" type="password" id="confirmpassword" required name="ConfirmPassword">
                    <input style="margin-bottom: 10px;" type="password" id="password" required name="password">


                </fieldset>
               <button>Create account</button> <br>
                 <a href="###">Already have an account?</a>
            </form>
              
        </div>
    </div>
</body>

</html>
